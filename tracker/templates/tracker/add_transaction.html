{% extends 'tracker/base.html' %}
{% load static %}
{% block body %}
<style>
.transaction-page {
    min-height: 100vh;
    background: #070B1A;
    padding: 50px 20px;
    box-sizing: border-box;
}

.transaction-form-container {
    width: 90%;
    max-width: 600px;
    margin: 0 auto;
    background: #101525;
    border: 1px solid #252D42;
    border-radius: 18px;
    padding: 30px;
    box-sizing: border-box;
}

.transaction-form-container h1 {
    color: #F8FAFC;
    margin: 0 0 30px;
    text-align: center;
}

.transaction-form-container form {
    display: flex;
    flex-direction: column;
}

.transaction-form-container label {
    color: #B8C2D6;
    font-size: 14px;
    margin-bottom: 8px;
}

.transaction-form-container input,
.transaction-form-container select {
    width: 100%;
    box-sizing: border-box;
    background: #181D2D;
    border: 1px solid #3A4560;
    color: #F8FAFC;
    padding: 13px;
    border-radius: 8px;
    margin-bottom: 20px;
    outline: none;
}

.transaction-form-container input::placeholder {
    color: #68748A;
}

.transaction-form-container input:focus,
.transaction-form-container select:focus {
    border-color: #6366F1;
    box-shadow: 0 0 0 2px rgba(99, 102, 241, 0.15);
}

.transaction-form-container select option {
    background: #181D2D;
    color: #F8FAFC;
}

.transaction-form-container button {
    background: #6366F1;
    color: #FFFFFF;
    border: none;
    padding: 13px;
    border-radius: 8px;
    font-size: 15px;
    cursor: pointer;
    margin-top: 5px;
}

.transaction-form-container button:hover {
    background: #4F46E5;
}
</style>

<div class="transaction-page">
<div class="transaction-form-container">

    <h1>Add Transaction</h1>

    <form id="transactionForm">

        <label>Amount</label>
        <input type="number" id="amount" step="0.01" required>

        <label>Transaction Type</label>
        <select id="transactionType" required>
            <option value="">Select type</option>
            <option value="income">Income</option>
            <option value="expense">Expense</option>
        </select>

        <label>Category</label>
        <input type="text" id="category" required>

        <label>Description</label>
        <input type="text" id="description">

        <button type="submit" id="submitButton">Add Transaction</button>

    </form>

</div>
</div>
<script src="{% static 'tracker/js/add_transaction.js' %}"></script>
{% endblock %}
