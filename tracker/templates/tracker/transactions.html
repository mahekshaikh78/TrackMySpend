{% extends 'tracker/base.html' %}

{% block head %}
<title>Transaction History - TrackMySpend</title>

<style>
	
    body {
        margin: 0;
        background: #080B16;
        color: #F8FAFC;
        font-family: Arial, sans-serif;
        overflow-x: hidden;
    }

    body::before {
        content: "";
        position: fixed;
        width: 500px;
        height: 500px;
        background: rgba(139, 92, 246, 0.08);
        border-radius: 50%;
        filter: blur(130px);
        top: -180px;
        left: -180px;
        z-index: -1;
    }

    body::after {
        content: "";
        position: fixed;
        width: 450px;
        height: 450px;
        background: rgba(245, 185, 66, 0.05);
        border-radius: 50%;
        filter: blur(130px);
        bottom: -180px;
        right: -180px;
        z-index: -1;
    }

    /* your existing CSS below */
    .transactions-page {
        width: 100%;
        max-width: 1200px;
        margin: auto;
        padding: 40px 25px 60px;
    }

    .transactions-page h1 {
        margin: 0;
        font-size: 32px;
        color: #F8FAFC;
    }
    .back-dashboard {
    display: inline-block;
    margin-bottom: 20px;
    padding: 10px 16px;
    background: #181D2D;
    border: 1px solid #6366F1;
    border-radius: 8px;
    color: #C7D0E0;
    text-decoration: none;
    font-size: 14px;
    transition: all 0.2s ease;
}

.back-dashboard:hover {
    background: #252D42;
    border-color: #818CF8;
    color: #FFFFFF;
}
    .transactions-page > p {
        margin-top: 8px;
        color: #9CA8BC;
        font-size: 15px;
    }

    #transactionList {
        margin-top: 30px;
        background: #101525;
        border: 1px solid #252D42;
        border-radius: 18px;
        overflow: hidden;
    }

    .transaction {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 20px 25px;
    border-bottom: 1px solid #1D2435;
    transition: background 0.2s ease;
}

.transaction:last-child {
    border-bottom: none;
}

.transaction:hover {
    background: #141A2A;
}

.transaction-left {
    display: flex;
    align-items: center;
    gap: 15px;
}

.transaction-icon {
    width: 45px;
    height: 45px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #181D2D;
    border: 1px solid #2A3348;
    border-radius: 12px;
    font-size: 20px;
}

.transaction-category {
    color: #F8FAFC;
    font-size: 15px;
    font-weight: 600;
}

.transaction-description {
    margin-top: 5px;
    color: #9CA8BC;
    font-size: 13px;
}

.transaction-date {
    margin-top: 4px;
    color: #718096;
    font-size: 12px;
}

.transaction-amount {
    font-size: 15px;
    font-weight: 600;
}

.income {
    color: #4ADE80;
}

.expense {
    color: #F87171;
}

.transaction-actions {
    display: flex;
    align-items: center;
    gap: 10px;
}

.edit-btn,
.delete-btn {
    width: 36px;
    height: 36px;
    border: 1px solid #2A3348;
    border-radius: 9px;
    background: #181D2D;
    cursor: pointer;
    font-size: 16px;
}

.edit-btn:hover {
    background: #1E293B;
}

.delete-btn:hover {
    background: #3A1D25;
}

</style>
{% endblock %}

{% block body %}

<div class="transactions-page">
      <a href="/dashboard/" class="back-dashboard">
        ← Back to Dashboard
    </a>
    <h1>Transaction History</h1>
    <p>View and manage all your transactions</p>

    <div id="transactionList">
        <!-- Transactions will appear here -->
    </div>

</div>

{% load static %}

<script src="{% static 'tracker/js/transactions.js' %}"></script>
{% endblock %}
